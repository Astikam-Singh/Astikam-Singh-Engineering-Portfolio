kind = "web"
previewPath = "/"
title = "Astikam Singh — Engineering Portfolio"
description = "A personal engineering portfolio showcasing Astikam Singh’s data engineering, backend, and cloud experience, selected projects, skills, certifications, and contact details."
version = "1.0.0"
id = "artifacts/astikam-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20814

[services.development]
run = "pnpm --filter @workspace/astikam-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/astikam-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/astikam-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20814"
BASE_PATH = "/"
